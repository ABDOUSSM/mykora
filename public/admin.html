<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">إضافة منتج جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input id="name" placeholder="اسم المنتج" class="border p-2 rounded focus:ring-2 focus:ring-green-500 outline-none">
                <input id="price" placeholder="السعر (DT)" class="border p-2 rounded focus:ring-2 focus:ring-green-500 outline-none">
                <input id="quantity" type="number" placeholder="الكمية" class="border p-2 rounded focus:ring-2 focus:ring-green-500 outline-none">
                <input id="description" placeholder="الوصف" class="border p-2 rounded focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div class="mb-4">
                <label class="block mb-1 font-semibold text-gray-600">الصورة الرئيسية للمنتج:</label>
                <input type="file" id="mainImage" class="border p-1 w-full rounded bg-gray-50">
            </div>
            <div class="border p-4 rounded bg-gray-50 mb-4">
                <h3 class="font-bold mb-3 text-gray-700">إضافة الألوان وصورها</h3>
                <div id="color-container" class="space-y-3">
                    <div class="flex gap-2 color-row">
                        <input type="text" placeholder="اسم اللون" class="c-name border p-2 flex-1 rounded">
                        <input type="file" class="c-file border p-1 rounded">
                    </div>
                </div>
                <button type="button" onclick="addColorField()" class="mt-3 text-blue-600 text-sm font-bold hover:underline">+ إضافة لون إضافي</button>
            </div>
            <button onclick="saveProduct()" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition">حفظ المنتج ونشره</button>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-6 text-red-600">إدارة المنتجات (حذف)</h2>
            <div id="products-list" class="space-y-3"></div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-6 text-blue-600">طلبات الزبائن الواردة</h2>
            <div id="orders-list" class="space-y-4"></div>
        </div>

    </div>

    <script>
        // --- إدارة الألوان ---
        function addColorField() {
            const container = document.getElementById('color-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 color-row mt-2';
            div.innerHTML = `
                <input type="text" placeholder="اسم اللون" class="c-name border p-2 flex-1 rounded">
                <input type="file" class="c-file border p-1 rounded">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 text-xs font-bold border border-red-200 px-2 rounded">حذف</button>
            `;
            container.appendChild(div);
        }

        // --- إدارة المنتجات ---
        async function loadAdminProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const container = document.getElementById('products-list');
                container.innerHTML = products.length === 0 ? "<p class='text-gray-400 text-center'>لا توجد منتجات.</p>" : 
                products.map(p => `
                    <div class="border p-4 flex justify-between items-center bg-gray-50 rounded-lg">
                        <div><span class="font-bold">${p.name}</span> - <span class="text-green-600 font-semibold">${p.price} DT</span></div>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 transition">حذف</button>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        async function saveProduct() {
            const fd = new FormData();
            fd.append('name', document.getElementById('name').value);
            fd.append('price', document.getElementById('price').value);
            fd.append('description', document.getElementById('description').value);
            fd.append('quantity', document.getElementById('quantity').value || 0);
            fd.append('image', document.getElementById('mainImage').files[0]);

            const colorNamesArray = [];
            document.querySelectorAll('.color-row').forEach(row => {
                const colorName = row.querySelector('.c-name').value;
                const colorFile = row.querySelector('.c-file').files[0];
                if (colorName && colorFile) {
                    colorNamesArray.push(colorName);
                    fd.append('colorImages', colorFile);
                }
            });
            fd.append('colorNames', JSON.stringify(colorNamesArray));

            const res = await fetch('/api/products', { method: 'POST', body: fd });
            const result = await res.json();
            if (result.success) { alert("✅ تم بنجاح!"); location.reload(); }
        }

        async function deleteProduct(id) {
            if(confirm("هل أنت متأكد من الحذف؟")) {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                loadAdminProducts();
            }
        }

        // --- إدارة الطلبات والحالات ---
        async function loadOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                const container = document.getElementById('orders-list');
                
                if(orders.length === 0) {
                    container.innerHTML = "<p class='text-gray-500 text-center py-4'>لا توجد طلبات جديدة.</p>";
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="border-2 ${getStatusClass(o.status)} p-4 rounded-lg bg-white shadow-sm mb-4">
                        <div class="flex justify-between mb-2">
                            <span class="font-bold text-lg">طلب رقم #${o.id}</span>
                            <span class="px-2 py-1 rounded text-xs font-bold bg-gray-100 border">${o.status || 'قيد الانتظار'}</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-gray-700 mb-4">
                            <p><strong>المنتج:</strong> ${o.productName}</p>
                            <p><strong>الزبون:</strong> ${o.userName || o.name}</p>
                            <p><strong>الهاتف:</strong> ${o.phone}</p>
                            <p><strong>العنوان:</strong> ${o.city} - ${o.address}</p>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-3 border-t">
                            <button onclick="updateStatus(${o.id}, 'تم التوصيل')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">✅ وصلت</button>
                            <button onclick="updateStatus(${o.id}, 'في قيد التوصيل')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">🚚 في الطريق</button>
                            <button onclick="updateStatus(${o.id}, 'ملغي')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">❌ ألغي</button>
                            <button onclick="updateStatus(${o.id}, 'مسترجع')" class="bg-orange-500 text-white px-2 py-1 rounded text-xs">🔄 Retour</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function getStatusClass(status) {
            switch(status) {
                case 'تم التوصيل': return 'border-green-500';
                case 'في قيد التوصيل': return 'border-blue-500';
                case 'ملغي': return 'border-red-500';
                case 'مسترجع': return 'border-orange-500';
                default: return 'border-gray-200';
            }
        }

        async function updateStatus(id, newStatus) {
            const res = await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const result = await res.json();
            if (result.success) loadOrders();
        }

        window.onload = function() {
            loadAdminProducts();
            loadOrders();
            setInterval(loadOrders, 30000);
        };
    </script>
</body>
</html>
